[package]
name = "sticky-harness"
version = "0.1.0"
description = "Minimal desktop sticky notes with a local AI harness status panel."
authors = ["sticky-harness"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which matters on Windows. See https://github.com/rust-lang/cargo/issues/8519
name = "sticky_harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` enables the system tray; `image-png` lets Tauri decode the
# bundled window icon for reuse as the tray icon.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `time` is used to debounce window move/resize writes on the async runtime
# that Tauri already drives.
tokio = { version = "1", features = ["time"] }
# Lets a clicked Markdown link open in the user's default browser without the
# frontend ever spawning a shell command itself.
tauri-plugin-opener = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
